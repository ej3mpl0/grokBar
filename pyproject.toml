[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-bar"
version = "0.3.0"
description = "Windows system tray usage monitor for Grok Build"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GrokBar" }]
dependencies = [
  "pystray>=0.19.5",
  "Pillow>=10.0.0",
]

[project.scripts]
grok-bar = "grok_bar.__main__:cli"

[tool.setuptools.packages.find]
include = ["grok_bar*"]
